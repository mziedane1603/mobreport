<style>
  :root{
    --bg:#F1F5F2;
    --surface:#FFFFFF;
    --surface-2:#EAF1EC;
    --ink:#132720;
    --ink-soft:#5A6E64;
    --ink-faint:#8B9C93;
    --brand:#0B6E4F;
    --brand-dark:#084F39;
    --brand-light:#E2F2E9;
    --accent:#C6862F;
    --accent-light:#FBF0DD;
    --danger:#BD4438;
    --danger-light:#FBEAE7;
    --border:#DCE6E0;
    --shadow-sm: 0 2px 10px rgba(19,39,32,.07);
    --shadow-md: 0 10px 26px rgba(19,39,32,.12);
    --radius: 16px;
    --font-d:'Cairo',sans-serif;
    --font-b:'Tajawal',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:var(--font-b);color:var(--ink);
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
    min-height:100vh;
    font-size:14.5px;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;}

  /* Header */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--brand-dark),var(--brand));
    color:#fff;padding:16px 16px 14px;
    padding-top:calc(16px + env(safe-area-inset-top));
    border-radius:0 0 20px 20px;
    box-shadow:var(--shadow-md);
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .topbar h1{font-family:var(--font-d);font-size:19px;font-weight:800;margin:0;}
  .topbar .sub{font-size:11.5px;color:#BFE3CE;margin-top:3px;}
  .sync-pill{
    display:flex;align-items:center;gap:5px;font-size:10.5px;background:rgba(0,0,0,.16);
    padding:4px 9px;border-radius:20px;color:#DCEFE3;white-space:nowrap;
  }
  .sync-dot{width:6px;height:6px;border-radius:50%;background:#8CE2AE;flex:none;}
  .sync-dot.bad{background:#F0A0A0;}

  /* KPI strip */
  .kpi-strip{
    display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
    margin-top:14px;
  }
  .kpi-card{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
    border-radius:12px;padding:10px 12px;
  }
  .kpi-card .l{font-size:10.5px;color:#BFE3CE;margin-bottom:3px;}
  .kpi-card .v{font-family:var(--font-d);font-size:17px;font-weight:800;color:#fff;}

  /* Content */
  .content{padding:16px;}

  .section-title{
    font-family:var(--font-d);font-weight:800;font-size:15px;margin:20px 2px 10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .section-title:first-child{margin-top:0;}

  /* dimension chips */
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;padding:9px 16px;border-radius:20px;background:var(--surface);
    border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--ink-soft);
    white-space:nowrap;transition:.15s;
  }
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand);}

  /* sort chips */
  .sort-row{display:flex;gap:8px;align-items:center;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
  .sort-row::-webkit-scrollbar{display:none;}
  .sort-chip{
    flex:none;padding:6px 12px;border-radius:16px;background:var(--surface-2);
    font-size:12px;font-weight:600;color:var(--ink-soft);border:1px solid transparent;
  }
  .sort-chip.active{background:var(--brand-light);color:var(--brand-dark);border-color:#BFE3CE;}

  /* chart card */
  .chart-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 14px 8px;box-shadow:var(--shadow-sm);margin-bottom:16px;
  }
  .chart-card h3{margin:0 0 10px;font-family:var(--font-d);font-size:14px;}
  .chart-wrap{position:relative;height:200px;}

  /* report cards */
  .rep-list{display:flex;flex-direction:column;gap:10px;}
  .rep-card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:13px 14px;box-shadow:var(--shadow-sm);
  }
  .rep-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .rep-rank{
    width:24px;height:24px;border-radius:8px;background:var(--brand-light);color:var(--brand-dark);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none;
    font-family:var(--font-d);
  }
  .rep-name{font-weight:700;font-size:14.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rep-value{font-family:var(--font-d);font-weight:800;color:var(--brand-dark);font-size:15px;white-space:nowrap;}

  .rep-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
  .stat{background:var(--surface-2);border-radius:9px;padding:6px 8px;text-align:center;}
  .stat .n{font-family:var(--font-d);font-weight:800;font-size:13px;color:var(--ink);}
  .stat .l{font-size:9.5px;color:var(--ink-soft);margin-top:1px;}

  .closing-bar-wrap{display:flex;align-items:center;gap:8px;}
  .closing-bar{flex:1;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
  .closing-bar-fill{height:100%;background:var(--brand);border-radius:4px;}
  .closing-pct{font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}

  .empty{
    text-align:center;padding:40px 20px;color:var(--ink-faint);font-size:13px;
  }
  .skeleton{
    background:linear-gradient(90deg,var(--surface-2) 25%,#F5F8F6 37%,var(--surface-2) 63%);
    background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:14px;height:78px;
  }
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

  .footer-note{
    text-align:center;color:var(--ink-faint);font-size:11px;padding:18px 20px 4px;
  }
</style>
</head>
<body>

<div class="topbar">

<div class="content">

  <div class="section-title">التجميع حسب</div>
  <div class="chips" id="dimChips"></div>

  <div class="section-title" style="margin-top:14px">الفترة</div>
  <div class="row" style="display:flex;gap:8px">
    <input type="date" id="dateFrom" style="flex:1;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);font-family:inherit;font-size:12.5px;color:var(--ink)">
    <input type="date" id="dateTo" style="flex:1;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);font-family:inherit;font-size:12.5px;color:var(--ink)">
  </div>

  <div class="chart-card" style="margin-top:16px">
    <h3 id="chartTitle">القيمة حسب الموزع</h3>
    <div class="chart-wrap"><canvas id="dimChart"></canvas></div>
  </div>

    <span>التفاصيل</span>
    <span id="countBadge" style="font-size:11px;color:var(--ink-faint);font-weight:500"></span>
  </div>
  <div class="sort-row" id="sortRow"></div>
  <div class="rep-list" id="repList">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <div class="footer-note">البيانات محدّثة لحظيًا من نفس قاعدة بيانات التطبيق الرئيسي — للعرض فقط</div>
</div>

<script>
/* ==========================================================================
   FIREBASE — same project as the main app, read-only.
   ========================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCNL2YgbFeueqQDgcLornLIY5ipVj8AJ6E",
  authDomain: "salesinvoices-49e7f.firebaseapp.com",
  projectId: "salesinvoices-49e7f",
  storageBucket: "salesinvoices-49e7f.firebasestorage.app",
  messagingSenderId: "1097222700865",
  appId: "1:1097222700865:web:f4946f863b4ce3f2a1ebc0",
  measurementId: "G-3FXWDBZLKL"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let INVOICES = [];
let DEFS = { controls:[], distributors:[] };

function setSync(ok){
  document.getElementById('syncDot').classList.toggle('bad', !ok);
  document.getElementById('syncText').textContent = ok ? 'متصل' : 'تعذّر الاتصال';
}

db.collection('invoices').onSnapshot(snap=>{
  INVOICES = snap.docs.map(d=>d.data());
  setSync(true);
  renderAll();
}, err=>{ setSync(false); console.error(err); });

db.collection('meta').doc('definitions').onSnapshot(doc=>{
  DEFS = doc.exists ? Object.assign({controls:[],distributors:[]}, doc.data()) : {controls:[],distributors:[]};
}, err=>console.error(err));

/* ==========================================================================
   HELPERS
   ========================================================================== */
function fmtNum(n){ return (Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2}); }

const REPORT_DIMS = {
  distributor: { label:'الموزع' },
  city: { label:'المدينة' },
  control: { label:'كنترول المخزن' },
  payStatus: { label:'حاله الدفع' },
};
let dim = 'distributor';
let sortKey = 'value'; // value | count | closedPct
let dateFrom = '', dateTo = '';

/* ==========================================================================
   RENDER
   ========================================================================== */
function buildRows(){
  const map = {};
  INVOICES.forEach(r=>{
    const d = String(r.date||'').slice(0,10);
    if(dateFrom && d < dateFrom) return;
    if(dateTo && d > dateTo) return;
    const key = r[dim] || 'غير محدد';
    if(!map[key]) map[key] = { name:key, count:0, items:0, value:0, closed:0, open:0 };
    const m = map[key];
    m.count++;
    m.items += Number(r.itemsCount)||0;
    m.value += Number(r.total)||0;
    if(Number(r.closed)===1) m.closed++; else m.open++;
  });
  return Object.values(map).map(m=>({
    ...m, avg: m.count? m.value/m.count:0, closedPct: m.count? Math.round(m.closed/m.count*100):0
  }));
}

let chartRef = null;
function renderKPIs(){
  const ranged = INVOICES.filter(r=>{
    const d = String(r.date||'').slice(0,10);
    if(dateFrom && d < dateFrom) return false;
    if(dateTo && d > dateTo) return false;
    return true;
  });
  const total = ranged.reduce((s,r)=>s+(Number(r.total)||0),0);
  const closed = ranged.filter(r=>Number(r.closed)===1).length;
  const cards = [
    { l:'عدد الفواتير', v: fmtNum(ranged.length) },
    { l:'إجمالي القيمة', v: fmtNum(total) },
    { l:'نسبة الإغلاق', v: (ranged.length? Math.round(closed/ranged.length*100):0)+'٪' },
    { l:'متوسط الفاتورة', v: fmtNum((ranged.length? total/ranged.length:0).toFixed(0)) },
  ];
  document.getElementById('kpiStrip').innerHTML = cards.map(c=>`
    <div class="kpi-card"><div class="l">${c.l}</div><div class="v">${c.v}</div></div>
  `).join('');
}

function renderChips(){
  document.getElementById('dimChips').innerHTML = Object.keys(REPORT_DIMS).map(k=>`
    <button class="chip ${dim===k?'active':''}" data-dim="${k}">${REPORT_DIMS[k].label}</button>
  `).join('');
  document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>{
    dim = c.dataset.dim;
    renderAll();
  }));
}

function renderSort(){
  const opts = [ {k:'value',l:'الأعلى قيمة'}, {k:'count',l:'الأكثر فواتير'}, {k:'closedPct',l:'الأعلى إغلاقًا'} ];
  document.getElementById('sortRow').innerHTML = opts.map(o=>`
    <button class="sort-chip ${sortKey===o.k?'active':''}" data-sort="${o.k}">${o.l}</button>
  `).join('');
  document.querySelectorAll('.sort-chip').forEach(c=>c.addEventListener('click', ()=>{
    sortKey = c.dataset.sort; renderAll();
  }));
}

function renderChart(rows){
  document.getElementById('chartTitle').textContent = 'القيمة حسب ' + REPORT_DIMS[dim].label;
  const top = [...rows].sort((a,b)=>b.value-a.value).slice(0,6);
  const palette = ['#0B6E4F','#C6862F','#3E7CB1','#BD4438','#7A5FBF','#2FA39A'];
  if(chartRef) chartRef.destroy();
  if(typeof Chart==='undefined'){
    document.getElementById('dimChart').parentElement.innerHTML = '<div class="empty">تعذّر تحميل مكتبة الرسوم</div>';
    return;
  }
  chartRef = new Chart(document.getElementById('dimChart'), {
    type:'bar',
    data:{ labels: top.map(t=>t.name), datasets:[{ data: top.map(t=>t.value), backgroundColor: top.map((_,i)=>palette[i%palette.length]), borderRadius:6 }]},
    options:{
      indexAxis:'y',
      plugins:{ legend:{display:false} },
      scales:{ x:{beginAtZero:true, ticks:{font:{size:10}}}, y:{ticks:{font:{size:11}}} }
    }
  });
}

function renderList(rows){
  document.getElementById('countBadge').textContent = rows.length + ' ' + REPORT_DIMS[dim].label;
  const mult = -1; // always show best-first for the chosen metric
  const sorted = [...rows].sort((a,b)=>(b[sortKey]||0)-(a[sortKey]||0));
  if(!sorted.length){
    document.getElementById('repList').innerHTML = '<div class="empty">لا توجد بيانات بعد</div>';
    return;
  }
  document.getElementById('repList').innerHTML = sorted.map((r,i)=>`
    <div class="rep-card">
      <div class="rep-card-top">
        <div class="rep-rank">${i+1}</div>
        <div class="rep-name">${r.name}</div>
        <div class="rep-value">${fmtNum(r.value)}</div>
      </div>
      <div class="rep-stats">
        <div class="stat"><div class="n">${fmtNum(r.count)}</div><div class="l">فاتورة</div></div>
        <div class="stat"><div class="n">${fmtNum(r.items)}</div><div class="l">صنف</div></div>
        <div class="stat"><div class="n">${fmtNum(r.avg.toFixed(0))}</div><div class="l">متوسط</div></div>
      </div>
      <div class="closing-bar-wrap">
        <div class="closing-bar"><div class="closing-bar-fill" style="width:${r.closedPct}%"></div></div>
        <div class="closing-pct">${r.closedPct}٪ مغلقة</div>
      </div>
    </div>
  `).join('');
}

function renderAll(){
  renderKPIs();
  renderChips();
  renderSort();
  const rows = buildRows();
  renderChart(rows);
  renderList(rows);
}

document.getElementById('dateFrom').addEventListener('change', e=>{ dateFrom = e.target.value; renderAll(); });
document.getElementById('dateTo').addEventListener('change', e=>{ dateTo = e.target.value; renderAll(); });

renderAll();
</script>
